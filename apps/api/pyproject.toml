[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ps01-api"
version = "0.1.0"
description = "Authenticated API for the PS-01 secure knowledge workspace"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
