services:
  - type: web
    name: clearframe-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_CHAT_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: GENERATION_BUDGET_SECONDS
        value: "45"
      - key: GEMINI_PROJECT_ID
        sync: false
      - key: GEMINI_SECONDARY_PROJECT_ID
        sync: false
      - key: GEMINI_SECONDARY_API_KEY
        sync: false
  - type: web
    name: clearframe-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: API_INTERNAL_URL
        sync: false
